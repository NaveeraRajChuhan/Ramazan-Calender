<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramadan 2026 | Karachi Edition</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="stars"></div> 

    <div class="container py-5">
        <div class="text-center mb-5">
            <h1 class="title-gold">RAMADAN KAREEM 2026</h1>
            <p class="text-light opacity-75">Estimated Start: Feb 18, 2026 (Karachi, Pakistan)</p>
            
            <div id="countdown" class="d-flex justify-content-center gap-3 mt-4">
                <div class="time-box"> <span id="days">00</span><p>Days</p> </div>
                <div class="time-box"> <span id="hours">00</span><p>Hours</p> </div>
                <div class="time-box"> <span id="minutes">00</span><p>Mins</p> </div>
            </div>
        </div>

        <div class="glass-container">
            <div class="table-responsive">
                <table class="table table-dark table-hover mb-0">
                    <thead>
                        <tr>
                            <th>Roza</th>
                            <th>Date (2026)</th>
                            <th>Sehar</th>
                            <th>Iftar</th>
                        </tr>
                    </thead>
                    <tbody id="calendar-data">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
